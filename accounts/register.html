{% extends 'base.html' %} {% block content %} <div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2 style="text-align: center;">Sign Up</h2> <form method="POST" onsubmit="return validateEduEmail()"> {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label>Username:</label><br> <input type="text" name="username" required style="width: 100%;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Email Address (.edu):</label><br> <input type="email" id="email" name="email" required style="width: 100%;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Password:</label><br> <input type="password" name="password" required style="width: 100%;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Confirm Password:</label><br> <input type="password" name="confirm_password" required style="width: 100%;">
        </div>

        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Register
        </button>
    </form>

    <p style="text-align: center; margin-top: 15px;">
        Already have an account? <a href="{% url 'login' %}">Log In</a> </p>
</div>

<script>
/**
 * JavaScript validation for university email suffix [cite: 6]
 */
function validateEduEmail() {
    const emailInput = document.getElementById('email').value;
    // Validate that the email ends with .edu [cite: 6, 139]
    if (!emailInput.toLowerCase().endsWith('.edu')) {
        alert("A valid university email (.edu) is required for registration.");
        return false;
    }
    return true;
}
</script>
{% endblock %}
