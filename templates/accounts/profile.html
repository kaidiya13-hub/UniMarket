{% extends 'base.html' %} {% block content %} <div style="max-width: 500px; margin: 50px auto; text-align: center; padding: 30px; border: 1px solid #eee; border-radius: 15px; background-color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    
    <div style="width: 100px; height: 100px; background-color: #e9ecef; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 40px; color: #adb5bd;">👤</span>
    </div>

    <h3 style="margin-bottom: 5px;">{{ user.username }}</h3> <p style="color: #6c757d; margin-bottom: 25px;">{{ user.email }}</p> <hr style="margin: 20px 0;">

    <div style="display: flex; justify-content: center; gap: 15px;">
        <a href="#" style="padding: 10px 20px; border: 1px solid #007bff; color: #007bff; text-decoration: none; border-radius: 5px;">
            Edit Profile
        </a>
        
        <a href="{% url 'logout' %}" style="padding: 10px 20px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 5px;">
            Logout
        </a> </div>

</div>
{% endblock %}
