{% extends 'base.html' %} {% block content %} <div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2 style="text-align: center;">Log In</h2> <form method="POST"> {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label>Username or Email Address:</label><br> <input type="text" name="username" required style="width: 100%;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Password:</label><br> <input type="password" id="password" name="password" required style="width: 100%;">
        </div>

        <div style="margin-bottom: 15px;">
            <input type="checkbox" onclick="togglePassword()"> Show Password
        </div>

        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Log In
        </button>
    </form>

    <p style="text-align: center; margin-top: 15px;">
        New User? <a href="{% url 'register' %}">Sign Up</a> </p>
</div>

<script>
/**
 * Toggle password visibility for WCAG 3.3.7 compliance
 */
function togglePassword() {
    var x = document.getElementById("password");
    if (x.type === "password") {
        x.type = "text";
    } else {
        x.type = "password";
    }
}
</script>
{% endblock %}
