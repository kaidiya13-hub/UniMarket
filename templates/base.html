<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UniMarket{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; font-size: 1.5rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-primary" href="{% url 'marketplace' %}">📦 UniMarket</a> <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'marketplace' %}">HOME</a></li> 
                    {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link text-success fw-bold" href="{% url 'post_item' %}">POST</a></li> 
                        <li class="nav-item"><a class="nav-link" href="{% url 'seller_dashboard' %}">DASHBOARD</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">ME</a></li> 
                        <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">LOGOUT</a></li> 
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">LOGIN</a></li> 
                        <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">SIGN UP</a></li> 
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %} {% endblock content %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
